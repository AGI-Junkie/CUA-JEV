<!doctype html><html lang="en"><meta charset="utf-8"><title>Local task lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f8;color:#18243e;font:18px system-ui}header{padding:26px 44px;background:#152443;color:white}small{color:#acd4f9}main{max-width:1050px;margin:48px auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:24px}.card{background:white;border-radius:20px;padding:32px;box-shadow:0 8px 30px #192b4912}label{display:block;margin:22px 0 8px}input{font:inherit;padding:14px;border:1px solid #8996af;width:100%;border-radius:8px}button{font:inherit;padding:16px 24px;margin-top:24px;background:#1868d4;color:white;border:0;border-radius:9px;cursor:pointer}[role=status]{margin-top:24px;padding:20px;background:#e6eefb;min-height:70px}body[data-layout=stacked] main{max-width:660px;display:flex;flex-direction:column-reverse;margin:20px auto;gap:14px}body[data-layout=stacked] .card{padding:22px}body[data-layout=stacked] header{text-align:center;padding:16px}body[data-layout=stacked] button{width:100%}
</style><header><small>CUA-JEV • CONTROLLED LOCAL ACCEPTANCE</small><h1>Desk task lab</h1></header>
<main><section class="card"><h2>Prepare a note</h2><p>This fixture writes only to this page. No account, payment, submission, or external network.</p><label for="note">Note text</label><input id="note" aria-label="Note text" autocomplete="off"><button id="save">Save local note</button></section><aside class="card"><h2>Local receipt</h2><p>Enter the requested note and save it. Success requires the exact saved text.</p><div role="status" id="status">No note saved</div></aside></main>
<script>document.body.dataset.layout = new URLSearchParams(location.search).get('layout') || 'columns';document.querySelector('#save').onclick=()=>{document.querySelector('#status').textContent='Saved locally: '+document.querySelector('#note').value;};</script></html>
